rules:
  - id: hardcoded-sensitive-variable
    languages: [python]
    severity: ERROR
    message: Do not hardcode passwords, tokens, or secrets.
    patterns:
      - pattern: $NAME = $VALUE
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^(password|passwd|secret|token|api_key|apikey)$